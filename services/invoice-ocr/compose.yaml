services:
  invoice-ocr:
    build:
      context: .
    image: workorder-invoice-ocr:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      OCR_SERVICE_TOKEN: "${OCR_SERVICE_TOKEN:?OCR_SERVICE_TOKEN must be set}"
      OCR_RUNTIME_MODE: "production"
      OCR_BIND_HOST: "0.0.0.0"
      OCR_MAX_DOCUMENT_BYTES: "10485760"
      OCR_MAX_PAGES: "3"
      OCR_MAX_REGIONS: "5000"
      OCR_IMAGE_MAX_SIDE: "2200"
      OCR_MAX_IMAGE_PIXELS: "20000000"
      OCR_MAX_NATIVE_TEXT_CHARS: "100000"
      OCR_MAX_IN_FLIGHT_REQUESTS: "2"
      OCR_UPLOAD_TIMEOUT_SECONDS: "30"
      OCR_WORKER_TIMEOUT_SECONDS: "110"
      OCR_NATIVE_TIMEOUT_SECONDS: "8"
      OCR_WORKER_CPU_SECONDS: "90"
      OCR_WORKER_MEMORY_BYTES: "3221225472"
      OCR_WORKER_FILE_BYTES: "134217728"
    deploy:
      resources:
        limits:
          memory: 4G
