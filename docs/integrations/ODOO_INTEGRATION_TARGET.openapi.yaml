openapi: 3.1.0
info:
  title: Workorder Product - Odoo Integration API
  version: 1.0.0
  description: |
    Implemented and locally acceptance-tested service-to-service contract for
    Odoo integration. Browser-session routes are not part of this contract.
x-implementation-status: implemented
servers:
  - url: https://{productHost}/api/integrations/odoo/v1
    variables:
      productHost:
        default: example.invalid
security:
  - bearerAuth: []
paths:
  /workorders:
    get:
      operationId: listOdooWorkorders
      summary: List company-scoped Odoo workorders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, missing_info, entered]
            default: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated workorder summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkorderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /workorders/{workorderId}:
    get:
      operationId: getOdooWorkorder
      summary: Read one integration-safe workorder payload
      parameters:
        - $ref: "#/components/parameters/WorkorderId"
      responses:
        "200":
          description: Integration-safe workorder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workorder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /workorders/{workorderId}/result:
    put:
      operationId: recordOdooResult
      summary: Atomically record entered or missing-information result
      parameters:
        - $ref: "#/components/parameters/WorkorderId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EnteredResult"
                - $ref: "#/components/schemas/MissingInfoResult"
      responses:
        "200":
          description: Result stored or matching idempotent result replayed
          headers:
            Idempotency-Replayed:
              description: Present with value true when the original response is replayed
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OdooResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: company-scoped integration token
  parameters:
    WorkorderId:
      name: workorderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    WorkorderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkorderSummary"
        nextCursor:
          type: [string, "null"]
    WorkorderSummary:
      type: object
      required: [id, serial, lifecycle, odooStatus, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string
        lifecycle:
          type: string
          enum: [closed, odoo_entered]
        odooStatus:
          type: string
          enum: [not_entered, missing_info, entered]
        updatedAt:
          type: string
          format: date-time
    Workorder:
      allOf:
        - $ref: "#/components/schemas/WorkorderSummary"
        - type: object
          required:
            - companyId
            - concern
            - diagnosis
            - workPerformed
            - customer
            - workDates
            - mechanics
            - parts
          properties:
            companyId:
              type: string
              format: uuid
            location:
              $ref: "#/components/schemas/Location"
            asset:
              oneOf:
                - $ref: "#/components/schemas/Asset"
                - type: "null"
            concern:
              type: string
            diagnosis:
              type: string
            workPerformed:
              type: string
            officeNotes:
              type: string
            serviceOrderNo:
              type: string
            externalId:
              type: string
            customer:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
            workDates:
              type: object
              required: [start, end]
              properties:
                start:
                  type: [string, "null"]
                end:
                  type: [string, "null"]
            odometer:
              type: [string, number, "null"]
            mechanics:
              type: array
              items:
                $ref: "#/components/schemas/Mechanic"
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
            closedAt:
              type: [string, "null"]
              format: date-time
            createdAt:
              type: string
              format: date-time
    Location:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        address:
          type: [string, "null"]
    Asset:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        unitNo:
          type: string
        name:
          type: string
        unitType:
          type: string
        vin:
          type: string
        licensePlate:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: [integer, "null"]
        lastOdometerMiles:
          type: [number, "null"]
        ownerName:
          type: string
    Mechanic:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assignmentRole:
          type: string
          enum: [primary, support]
        assignedAt:
          type: [string, "null"]
          format: date-time
    Part:
      type: object
      required: [partNo, qty, uomCode, repairOrder]
      properties:
        partNo:
          type: string
        qty:
          type: string
          pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,3})?$'
        uomCode:
          type: string
        repairOrder:
          type: string
    EnteredResult:
      type: object
      additionalProperties: false
      required: [status, serviceOrderNo, externalId]
      properties:
        status:
          const: entered
        serviceOrderNo:
          type: string
          minLength: 1
          maxLength: 120
        externalId:
          type: string
          minLength: 1
          maxLength: 300
        note:
          type: string
          maxLength: 1000
    MissingInfoResult:
      type: object
      additionalProperties: false
      required: [status, note]
      properties:
        status:
          const: missing_info
        note:
          type: string
          minLength: 1
          maxLength: 1000
    OdooResult:
      type: object
      required:
        - workorderId
        - status
        - updatedAt
      properties:
        workorderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [entered, missing_info]
        serviceOrderNo:
          type: string
        externalId:
          type: string
        note:
          type: string
        updatedAt:
          type: string
          format: date-time
    StructuredError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details: {}
    FlatError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/StructuredError"
              - $ref: "#/components/schemas/FlatError"
    Unauthorized:
      description: Missing or invalid integration credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredError"
    Forbidden:
      description: Credential lacks company or scope access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredError"
    NotFound:
      description: Workorder not found within credential scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredError"
    Conflict:
      description: Workorder not eligible, state stale, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredError"
    BodyTooLarge:
      description: Request exceeds the configured JSON body limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FlatError"
    UnsupportedMediaType:
      description: Request body does not use application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FlatError"
    RateLimited:
      description: Integration rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FlatError"
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FlatError"
